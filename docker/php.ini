; Production PHP settings for the site. Nothing exotic — the defaults are mostly
; right, and these are the handful that are not.

expose_php = Off
memory_limit = 192M
max_execution_time = 30

; No uploads anywhere on this site; leaving the door open would be careless.
file_uploads = Off
post_max_size = 1M

display_errors = Off
log_errors = On
error_log = /dev/stderr

; Every request compiles the same Blade views, so opcache is the single biggest
; difference between this being fast and being merely adequate.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1

date.timezone = UTC
