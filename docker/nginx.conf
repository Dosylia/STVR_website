# =============================================================================
# Production vhost.
#
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf. TLS is
# left to whatever terminates it in front — a reverse proxy, a load balancer, or
# certbot writing into this file's commented block. The app is told the real
# scheme through X-Forwarded-Proto either way.
# =============================================================================

# Tells PHP whether the original request was HTTPS, when something in front
# terminated TLS. Without it Laravel builds http:// canonical and hreflang URLs
# on an https:// site.
map $http_x_forwarded_proto $https_flag {
    default "";
    https   on;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 1m;

    access_log /var/log/nginx/stvr_access.log;
    error_log  /var/log/nginx/stvr_error.log warn;

    # Nothing here is user-generated and nothing is embedded from elsewhere, so
    # the policy can be strict enough to be worth having.
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fonts and the stylesheet carry ?v=<mtime>, so they can be cached hard.
    location ~* \.(?:css|js|woff2?|png|jpe?g|webp|avif|svg|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; }
    location = /sitemap.xml { try_files $uri /index.php?$query_string; access_log off; }

    location ~ ^/index\.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS $https_flag;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # Only the front controller is executable. A .php file anywhere else is
    # either a mistake or an attack, and neither should run.
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known) { deny all; }
}
