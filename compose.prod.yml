# =============================================================================
# Skyrim Together VR — production stack
# -----------------------------------------------------------------------------
# Two containers and nothing else: PHP-FPM with the app baked into the image,
# and nginx in front of it. No database, no Redis, no queue worker, because the
# site needs none of them — the devlog is markdown in the repo and the only
# external call is a cached GitHub request.
#
#   cp .env.example .env            # then fill in APP_KEY and APP_URL
#   docker compose -f compose.prod.yml up -d --build
#
# TLS: terminate it in front of this (a proxy, a load balancer, Cloudflare) and
# pass X-Forwarded-Proto, which the vhost already reads. Or uncomment the
# certbot service and the 443 mapping and let it handle the certificate.
# =============================================================================

name: stvr

services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: stvr-app:latest
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Skyrim Together VR}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env. Generate one with -- docker compose -f compose.prod.yml run --rm app php artisan key:generate --show}"
      APP_URL: "${APP_URL:?Set APP_URL in .env, with the scheme and no trailing slash}"
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: file
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

      STVR_GITHUB_REPO: ${STVR_GITHUB_REPO:-Dosylia/SkyrimTogetherVR}
      STVR_GITHUB_URL: ${STVR_GITHUB_URL:-https://github.com/Dosylia/SkyrimTogetherVR}
      STVR_ISSUES_URL: ${STVR_ISSUES_URL:-https://github.com/Dosylia/SkyrimTogetherVR/issues}
      STVR_RELEASES_URL: ${STVR_RELEASES_URL:-https://github.com/Dosylia/SkyrimTogetherVR/releases}
      STVR_GITHUB_TOKEN: ${STVR_GITHUB_TOKEN:-}
      STVR_RELEASE_CACHE_MINUTES: ${STVR_RELEASE_CACHE_MINUTES:-30}
      STVR_FALLBACK_TAG: ${STVR_FALLBACK_TAG:-}
      STVR_FALLBACK_DATE: ${STVR_FALLBACK_DATE:-}
      STVR_FALLBACK_URL: ${STVR_FALLBACK_URL:-}
      STVR_DISCORD_URL: ${STVR_DISCORD_URL:-}
      STVR_NEXUS_URL: ${STVR_NEXUS_URL:-}
    volumes:
      # Only the two paths Laravel writes to. Everything else stays in the image
      # and is therefore identical to what was built and tested.
      - app_storage:/var/www/html/storage
    networks: [stvr]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # nginx with public/ baked in from the same build as the app image, so the
  # two can never drift apart.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: stvr-web:latest
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "443:443"
    # volumes:
      # - ./docker/certbot/conf:/etc/letsencrypt:ro
      # - ./docker/certbot/www:/var/www/certbot:ro
    networks: [stvr]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/robots.txt >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./docker/certbot/conf:/etc/letsencrypt
  #     - ./docker/certbot/www:/var/www/certbot
  #   entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"]

networks:
  stvr:
    driver: bridge

volumes:
  app_storage:
